// Server → Workstation 业务命令。
// 设计依据：§65、§60、§129。
syntax = "proto3";

package aie.v1;

option go_package = "github.com/ai-employee-platform/gen/go/aie/v1;aiev1";

import "aie/v1/common.proto";
import "aie/v1/skill_sync.proto";

// CommandType 允许的业务命令（禁止任意 Shell）。
enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_START_JOB = 1;
  COMMAND_TYPE_STOP_JOB = 2;
  COMMAND_TYPE_START_SESSION = 3;
  COMMAND_TYPE_STOP_SESSION = 4;
  COMMAND_TYPE_INSTALL_PROVIDER = 5;
  COMMAND_TYPE_UPDATE_PROVIDER = 6;
  COMMAND_TYPE_SYNC_WORKSPACE = 7;
  COMMAND_TYPE_UPDATE_WORKSTATION = 8;
  COMMAND_TYPE_SYNC_SKILLS = 9;
  COMMAND_TYPE_RESOLVE_INQUIRY = 10;
}

// Command Control Plane 下发给 Workstation 的命令。
message Command {
  EnvelopeMeta meta = 1;
  string command_id = 2;
  string workstation_id = 3;
  string employee_id = 4;
  string job_id = 5;
  CommandType type = 6;
  // JSON 对象字符串，各命令自行约定字段（兼容旧工作站）。
  string payload_json = 7;
  // 结构化载荷（新工作站优先读取）。
  oneof structured {
    SyncSkillsPayload sync_skills = 8;
    StartJobPayload start_job = 9;
  }
}

// CommandAck 本地 SQLite COMMIT 成功后回传（§22）。
message CommandAck {
  string command_id = 1;
  uint64 sequence = 2;
  bool accepted = 3;
  string error_message = 4;
}
