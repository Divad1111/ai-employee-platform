// Session 状态与快照。
// 设计依据：§51、§52、§53。
syntax = "proto3";

package aie.v1;

option go_package = "github.com/ai-employee-platform/gen/go/aie/v1;aiev1";

// SessionStatus Agent Session 状态。
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_STARTING = 1;
  SESSION_STATUS_READY = 2;
  SESSION_STATUS_BUSY = 3;
  SESSION_STATUS_IDLE = 4;
  SESSION_STATUS_STOPPING = 5;
  SESSION_STATUS_STOPPED = 6;
  SESSION_STATUS_ERROR = 7;
}

// SessionSnapshot 会话快照（对齐 §53）。
message SessionSnapshot {
  string session_id = 1;
  string employee_id = 2;
  string provider = 3;
  string workspace_id = 4;
  int32 process_id = 5;
  SessionStatus status = 6;
  int64 created_at_unix_ms = 7;
  int64 started_at_unix_ms = 8;
  int64 last_activity_at_unix_ms = 9;
  int64 ended_at_unix_ms = 10;
  string workstation_id = 11;
}
