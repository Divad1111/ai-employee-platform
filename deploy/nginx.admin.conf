map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/infrastructure/releases {
        client_max_body_size 514m;
        proxy_pass http://control-plane:8080;
        include /etc/nginx/aie-proxy.conf;
    }
    location = /api/workflow-mcp/import {
        client_max_body_size 32m;
        proxy_pass http://control-plane:8080;
        include /etc/nginx/aie-proxy.conf;
    }
    location ~ ^/api/(artifacts|integrations/workstation/artifacts|jobs/[^/]+/attachments) {
        client_max_body_size 128m;
        proxy_pass http://control-plane:8080;
        include /etc/nginx/aie-proxy.conf;
    }
    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://control-plane:8080;
        include /etc/nginx/aie-proxy.conf;
    }
    location / { try_files $uri /index.html; }
}
