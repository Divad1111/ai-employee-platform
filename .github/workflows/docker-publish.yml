# 中心服务器容器镜像与工作站多平台发布工作流
# 参考规范：home-server-health-monitor 多架构发布机制
# 
# 包含两项核心发布产物：
# 1. 中心服务器 (Control Plane + Admin Web)：
#    - 在线镜像：发布多架构镜像至 GitHub Container Registry (ghcr.io)（linux/amd64 + linux/arm64）
#    - 离线镜像包：生成可直接导入群晖 NAS (DSM Container Manager) 及无外网服务器的 .tar.gz 镜像压缩包
# 2. 计算工作站 (Workstation aew)：
#    - 全平台原生二进制：Windows (.exe)、macOS (Apple Silicon & Intel Darwin)、Linux
# 3. 自动挂载发布资产 (Release Assets)：
#    - 触发 release 发布或推送版本标签时，自动将上述所有离线包与可执行文件及 SHA256 校验清单挂载至 GitHub Release

name: docker-publish

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
    branches: [main, master]
    paths:
      - "deploy/**"
      - "server/**"
      - "admin/**"
      - "workstation/**"
      - "gen/**"
      - "migrations/**"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach assets (e.g. 1.0.2)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  # ====================================================
  # 1. 在线发布：构建并推送多架构镜像至 GHCR (linux/amd64 + linux/arm64)
  # ====================================================
  build-and-push-ghcr:
    name: Push Multi-Arch Images to GHCR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.1 Control Plane
      - name: Extract metadata for Control Plane
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/control-plane
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Control Plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1.2 Admin Web
      - name: Extract metadata for Admin Web
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/admin
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Admin Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================================
  # 2. 离线镜像打包：生成群晖 NAS (DSM) / 离线服务器 .tar.gz 镜像包
  # ====================================================
  build-docker-dsm:
    name: Build Docker Images (DSM tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Export Control Plane (amd64)
        run: |
          mkdir -p dist
          IMAGE=aie-control-plane:latest
          docker buildx build \
            --platform linux/amd64 \
            -f deploy/Dockerfile.server \
            -t "$IMAGE" \
            --load \
            .
          docker save "$IMAGE" -o dist/control-plane-dsm-amd64.tar
          gzip -f dist/control-plane-dsm-amd64.tar
          ls -lh dist/control-plane-dsm-amd64.tar.gz

      - name: Build & Export Control Plane (arm64)
        run: |
          IMAGE=aie-control-plane:latest
          docker buildx build \
            --platform linux/arm64 \
            -f deploy/Dockerfile.server \
            -t "$IMAGE" \
            --load \
            .
          docker save "$IMAGE" -o dist/control-plane-dsm-arm64.tar
          gzip -f dist/control-plane-dsm-arm64.tar
          ls -lh dist/control-plane-dsm-arm64.tar.gz

      - name: Build & Export Admin Web (amd64)
        run: |
          IMAGE=aie-admin:latest
          docker buildx build \
            --platform linux/amd64 \
            -f deploy/Dockerfile.admin \
            -t "$IMAGE" \
            --load \
            .
          docker save "$IMAGE" -o dist/admin-dsm-amd64.tar
          gzip -f dist/admin-dsm-amd64.tar
          ls -lh dist/admin-dsm-amd64.tar.gz

      - name: Build & Export Admin Web (arm64)
        run: |
          IMAGE=aie-admin:latest
          docker buildx build \
            --platform linux/arm64 \
            -f deploy/Dockerfile.admin \
            -t "$IMAGE" \
            --load \
            .
          docker save "$IMAGE" -o dist/admin-dsm-arm64.tar
          gzip -f dist/admin-dsm-arm64.tar
          ls -lh dist/admin-dsm-arm64.tar.gz

      - name: Upload Docker DSM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-dsm
          path: dist/*-dsm-*.tar.gz
          if-no-files-found: error

  # ====================================================
  # 3. 工作站全平台可执行文件编译 (Windows / macOS / Linux)
  # ====================================================
  build-workstation-binaries:
    name: Build Workstation Native Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build cross-platform binaries
        working-directory: workstation
        run: |
          mkdir -p dist
          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/aew-windows-amd64.exe ./cmd/aew
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/aew-windows-arm64.exe ./cmd/aew
          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/aew-linux-amd64 ./cmd/aew
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/aew-linux-arm64 ./cmd/aew
          # macOS (Darwin)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/aew-darwin-amd64 ./cmd/aew
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/aew-darwin-arm64 ./cmd/aew
          ls -la dist/

      - name: Upload Workstation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workstation-binaries
          path: workstation/dist/
          if-no-files-found: error

  # ====================================================
  # 4. 挂载发布资产至 GitHub Release
  # ====================================================
  release-assets:
    name: Attach Release Assets
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: [build-docker-dsm, build-workstation-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Docker DSM packages
        uses: actions/download-artifact@v4
        with:
          name: docker-dsm
          path: dist

      - name: Download Workstation binaries
        uses: actions/download-artifact@v4
        with:
          name: workstation-binaries
          path: dist

      - name: Rename with tag & generate checksums
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}"
          echo "Processing assets for release tag: ${tag}"
          ls -la dist/
          mv dist/control-plane-dsm-amd64.tar.gz "dist/control-plane-dsm-${tag}-amd64.tar.gz"
          mv dist/control-plane-dsm-arm64.tar.gz "dist/control-plane-dsm-${tag}-arm64.tar.gz"
          mv dist/admin-dsm-amd64.tar.gz "dist/admin-dsm-${tag}-amd64.tar.gz"
          mv dist/admin-dsm-arm64.tar.gz "dist/admin-dsm-${tag}-arm64.tar.gz"
          mv dist/aew-windows-amd64.exe "dist/aew-${tag}-windows-amd64.exe"
          mv dist/aew-windows-arm64.exe "dist/aew-${tag}-windows-arm64.exe"
          mv dist/aew-darwin-amd64 "dist/aew-${tag}-darwin-amd64"
          mv dist/aew-darwin-arm64 "dist/aew-${tag}-darwin-arm64"
          mv dist/aew-linux-amd64 "dist/aew-${tag}-linux-amd64"
          mv dist/aew-linux-arm64 "dist/aew-${tag}-linux-arm64"
          chmod +x dist/aew-* || true
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}
          files: |
            dist/control-plane-dsm-*.tar.gz
            dist/admin-dsm-*.tar.gz
            dist/aew-*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
