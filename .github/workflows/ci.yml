# AI Employee Platform CI
# 对应任务：T-0105 / M1 proto

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    name: Go (proto + server + workstation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            server/go.sum
            workstation/go.sum
            gen/go.sum
      - name: install buf + protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: proto lint & generate
        run: |
          cd proto && buf lint && buf generate
          git diff --exit-code -- gen/go || (echo "生成物与提交不一致，请本地 make proto 后提交" && exit 1)
      - name: tidy & test server
        working-directory: server
        run: |
          go mod tidy
          go test ./...
      - name: tidy & test workstation
        working-directory: workstation
        run: |
          go mod tidy
          go test ./...
      - name: build server
        working-directory: server
        run: |
          go build -o bin/server ./cmd/server
          go build -o bin/migrate ./cmd/migrate
      - name: build workstation
        working-directory: workstation
        run: go build -o bin/aew ./cmd/aew

  admin:
    name: Admin (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
