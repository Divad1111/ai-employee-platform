# AI Employee Platform CI
# 支持多平台：Workstation (Windows / Linux / macOS) + Server (Go + proto) + Admin (Web)

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  proto-and-server:
    name: Proto & Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install buf + protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Proto lint & generate
        run: |
          cd proto && buf lint && buf generate
          git diff --exit-code -- gen/go || (echo "生成物与提交不一致，请本地 make proto 后提交" && exit 1)
      - name: Server tidy, test & build
        working-directory: server
        run: |
          go mod tidy
          go test -v ./...
          go build -o bin/server ./cmd/server
          go build -o bin/migrate ./cmd/migrate

  workstation:
    name: Workstation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Workstation tidy & test
        working-directory: workstation
        run: |
          go mod tidy
          go test -v ./...
      - name: Workstation native build (Unix)
        if: runner.os != 'Windows'
        working-directory: workstation
        run: |
          go build -v -o bin/aew ./cmd/aew
          ./bin/aew --help
      - name: Workstation native build (Windows)
        if: runner.os == 'Windows'
        working-directory: workstation
        run: |
          go build -v -o bin/aew.exe ./cmd/aew
          .\bin\aew.exe --help

  workstation-cross-build:
    name: Workstation Packaging (All OS & Arch)
    runs-on: ubuntu-latest
    needs: workstation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Build cross-platform binaries
        working-directory: workstation
        run: |
          mkdir -p dist
          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/aew-windows-amd64.exe ./cmd/aew
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/aew-windows-arm64.exe ./cmd/aew
          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/aew-linux-amd64 ./cmd/aew
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/aew-linux-arm64 ./cmd/aew
          # macOS (Darwin)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/aew-darwin-amd64 ./cmd/aew
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/aew-darwin-arm64 ./cmd/aew
          ls -la dist/
      - name: Upload Workstation Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aew-workstation-binaries
          path: workstation/dist/
          retention-days: 14

  admin:
    name: Admin (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
